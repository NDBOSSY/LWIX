{% extends "base.html" %}

{% block title %}Admin Verification - EALicense{% endblock %}

{% block extra_css %}
<style>
    .password-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #F8FAFC 0%, #E8F0FE 100%);
        padding: 2rem;
    }

    .password-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
        padding: 3rem;
        max-width: 420px;
        width: 100%;
        text-align: center;
    }

    .password-icon {
        width: 65px;
        height: 65px;
        background: linear-gradient(135deg, #4B7BE5 0%, #5534A5 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        color: white;
        font-size: 1.6rem;
    }

    .password-card h3 {
        font-weight: 700;
        color: #2D2D2D;
        margin-bottom: 0.5rem;
        font-size: 1.4rem;
    }

    .password-card p {
        color: #807F80;
        margin-bottom: 2rem;
        font-size: 0.9rem;
    }

    .input-group {
        margin-bottom: 1.5rem;
        text-align: left;
    }

    .input-group label {
        font-weight: 600;
        color: #2D2D2D;
        margin-bottom: 0.5rem;
        display: block;
        font-size: 0.9rem;
    }

    .input-group input {
        width: 100%;
        padding: 0.85rem 1rem;
        border: 2px solid #E5E7EB;
        border-radius: 12px;
        font-size: 1rem;
        transition: all 0.3s;
        background: #F8FAFC;
    }

    .input-group input:focus {
        outline: none;
        border-color: #6FDFDF;
        background: white;
        box-shadow: 0 0 0 3px rgba(111, 223, 223, 0.1);
    }

    .verify-btn {
        width: 100%;
        padding: 0.85rem;
        background: linear-gradient(135deg, #4B7BE5 0%, #5534A5 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.3s;
    }

    .verify-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(75, 123, 229, 0.3);
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 1.5rem;
        color: #807F80;
        text-decoration: none;
        font-size: 0.85rem;
        transition: color 0.3s;
    }

    .back-link:hover {
        color: #4B7BE5;
    }

    .security-note {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        margin-top: 1rem;
        color: #3FBFB3;
        font-size: 0.8rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="password-container">
    <div class="password-card">
        <div class="password-icon">
            <i class="fas fa-user-shield"></i>
        </div>
        <h3>Admin Verification</h3>
        <p>Enter admin password to receive OTP</p>

        <form method="POST">
            <div class="input-group">
                <label>Admin Password</label>
                <input type="password" name="password" required autofocus placeholder="Enter admin password">
            </div>

            <button type="submit" class="verify-btn">
                <i class="fas fa-lock me-2"></i>Verify & Get OTP
            </button>
        </form>

        <a href="{{ url_for('user_login') }}" class="back-link">
            <i class="fas fa-arrow-left me-1"></i>Back to Login
        </a>

        <div class="security-note">
            <i class="fas fa-shield-alt"></i>
            <span>OTP will be sent after password verification</span>
        </div>
    </div>
</div>
{% endblock %}
