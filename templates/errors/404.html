{% extends "base.html" %}
{% block title %}404 - Page Not Found{% endblock %}
{% block content %}
<div class="container text-center"
    style="min-height: 70vh; display: flex; align-items: center; justify-content: center;">
    <div>
        <i class="fas fa-exclamation-triangle text-warning" style="font-size: 6rem;"></i>
        <h1 class="display-1 fw-bold text-muted mt-3">404</h1>
        <h2>Page Not Found</h2>
        <p class="text-muted mb-4">The page you're looking for doesn't exist.</p>
        <a href="{{ url_for('user_login') }}" class="btn btn-primary btn-lg">
            <i class="fas fa-home me-2"></i>Go Home
        </a>
    </div>
</div>
{% endblock %}
