<!-- Navigation -->
<nav class="navbar navbar-expand-lg" style="padding-left: 0; padding-right: 0;">
    <div class="container-fluid px-4">
        <a class="navbar-brand" style="margin-left: 0; padding-left: 0;"
            href="{% if current_user.is_authenticated %}{% if current_user.is_admin %}{{ url_for('admin_dashboard') }}{% else %}{{ url_for('user_dashboard') }}{% endif %}{% else %}{{ url_for('user_login') }}{% endif %}">
            <div class="navbar-logo">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">
            </div>
            <span class="navbar-brand-text">Trading Engine</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav" style="flex-grow: 0; margin-left: auto;">
            <div class="navbar-actions">
                <!-- Rest of your navbar content remains the same -->
                {% if current_user.is_authenticated %}
                    {% if not current_user.is_admin %}
                    <div class="nav-lang-toggle" id="navLanguageToggle">
                        <button type="button" class="lang-option {{ 'active' if current_language == 'en' else '' }}" onclick="setLanguage('en')" data-lang="en">
                            <span class="lang-code">EN</span> English
                        </button>
                        <button type="button" class="lang-option {{ 'active' if current_language == 'nl' else '' }}" onclick="setLanguage('nl')" data-lang="nl">
                            <span class="lang-code">NL</span> Dutch
                        </button>
                    </div>
                    {% endif %}

                    {% if current_user.is_admin %}
                    <a class="nav-btn-dashboard" href="{{ url_for('admin_dashboard') }}">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                    <a class="nav-icon-btn" href="{{ url_for('admin_users') }}" title="Users">
                        <i class="fas fa-users"></i>
                    </a>
                    {% else %}
                    <a class="nav-icon-btn" href="{{ url_for('user_dashboard') }}" title="Account">
                        <i class="fas fa-user"></i>
                    </a>
                    {% endif %}

                    <a class="nav-btn-logout" href="{{ url_for('logout') }}">
                        <i class="fas fa-arrow-right-from-bracket"></i>
                        <span data-en="Logout" data-nl="Uitloggen">{{ 'Uitloggen' if current_language == 'nl' else 'Logout' }}</span>
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
